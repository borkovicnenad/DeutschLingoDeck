spring:
  application:
    name: backend-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deutschlingodeck}
    username: ${DB_USER:deutschlingodeck}
    password: ${DB_PASSWORD:deutschlingodeck}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # TODO: switch to "validate" once Flyway migrations exist for the
      # User/Dictionary/Card/Game/GameAnswer entities (STEP 12 of the
      # backend skeleton explicitly defers Flyway migrations).
      ddl-auto: none

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
