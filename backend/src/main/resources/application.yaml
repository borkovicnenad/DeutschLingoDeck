spring:
  application:
    name: backend-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:deutschlingodeck}
    username: ${DB_USER:deutschlingodeck}
    password: ${DB_PASSWORD:deutschlingodeck}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema (see db/migration).
      ddl-auto: none

security:
  jwt:
    # Dev-only default so the app runs out of the box with docker-compose.
    # Override via JWT_SECRET in any real deployment.
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-32bytes-min}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P7D}

cors:
  # Comma-separated list of allowed frontend origins. Override via CORS_ALLOWED_ORIGINS in
  # staging/production once those frontend URLs are known.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app:
  game:
    # How long an IN_PROGRESS game may sit idle before GameLifecycleReaper marks it ABANDONED.
    idle-timeout: ${GAME_IDLE_TIMEOUT:PT30M}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
