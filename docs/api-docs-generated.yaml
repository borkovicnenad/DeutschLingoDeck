openapi: 3.1.0
info:
  title: DeutschLingoDeck Backend API
  description: "REST API for DeutschLingoDeck, a German vocabulary learning platform."
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/v1/profile:
    get:
      tags:
      - profile-controller
      operationId: getProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileResponse"
    put:
      tags:
      - profile-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /api/v1/profile/password:
    put:
      tags:
      - profile-controller
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "200":
          description: OK
  /api/v1/dictionaries/{dictionaryId}:
    get:
      tags:
      - dictionary-controller
      operationId: getDictionary
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DictionaryDetailResponse"
    put:
      tags:
      - dictionary-controller
      operationId: updateDictionary
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDictionaryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DictionaryDetailResponse"
    delete:
      tags:
      - dictionary-controller
      operationId: deleteDictionary
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/dictionaries/{dictionaryId}/cards/{cardId}:
    get:
      tags:
      - dictionary-controller
      operationId: getCard
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: cardId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
    put:
      tags:
      - dictionary-controller
      operationId: updateCard
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: cardId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCardRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
    delete:
      tags:
      - dictionary-controller
      operationId: deleteCard
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: cardId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
  /api/v1/games:
    get:
      tags:
      - game-controller
      operationId: listGames
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - CREATED
          - STARTED
          - IN_PROGRESS
          - FINISHED
          - ABANDONED
      - name: dictionaryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseGameSummaryResponse"
    post:
      tags:
      - game-controller
      operationId: createGame
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResponse"
  /api/v1/games/{gameId}/finish:
    post:
      tags:
      - game-controller
      operationId: finishGame
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameSummaryResponse"
  /api/v1/games/{gameId}/answers:
    post:
      tags:
      - game-controller
      operationId: submitAnswer
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnswerValidationResponse"
  /api/v1/games/{gameId}/abandon:
    post:
      tags:
      - game-controller
      operationId: abandonGame
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameSummaryResponse"
  /api/v1/dictionaries:
    get:
      tags:
      - dictionary-controller
      operationId: listDictionaries
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseDictionarySummaryResponse"
    post:
      tags:
      - dictionary-controller
      operationId: createDictionary
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDictionaryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DictionaryDetailResponse"
  /api/v1/dictionaries/{dictionaryId}/cards:
    get:
      tags:
      - dictionary-controller
      operationId: listCards
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: tag
        in: query
        required: false
        schema:
          type: string
      - name: difficulty
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseCardSummaryResponse"
    post:
      tags:
      - dictionary-controller
      operationId: createCard
      parameters:
      - name: dictionaryId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCardRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CardDetailResponse"
  /api/v1/dictionaries/import:
    post:
      tags:
      - dictionary-controller
      operationId: importDictionary
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DictionaryImportRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DictionaryImportResponse"
  /api/v1/auth/register:
    post:
      tags:
      - authentication-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - authentication-controller
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - authentication-controller
      operationId: logout
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - authentication-controller
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/statistics:
    get:
      tags:
      - statistics-controller
      operationId: getDashboardStatistics
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DashboardStatisticsResponse"
  /api/v1/statistics/history:
    get:
      tags:
      - statistics-controller
      operationId: getLearningHistory
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseLearningHistoryResponse"
  /api/v1/statistics/dictionaries:
    get:
      tags:
      - statistics-controller
      operationId: getDictionaryStatistics
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DictionaryStatisticsResponse"
  /api/v1/statistics/cards:
    get:
      tags:
      - statistics-controller
      operationId: getCardStatistics
      parameters:
      - name: dictionaryId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseCardStatisticsResponse"
  /api/v1/gamification/weekly-activity:
    get:
      tags:
      - gamification-controller
      operationId: getWeeklyActivity
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeeklyActivityPointResponse"
  /api/v1/gamification/level-progress:
    get:
      tags:
      - gamification-controller
      operationId: getLevelProgress
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LevelProgressResponse"
  /api/v1/gamification/daily-goal:
    get:
      tags:
      - gamification-controller
      operationId: getDailyGoal
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DailyGoalResponse"
  /api/v1/gamification/achievements:
    get:
      tags:
      - gamification-controller
      operationId: getAchievements
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AchievementResponse"
  /api/v1/games/{gameId}:
    get:
      tags:
      - game-controller
      operationId: getGame
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameResponse"
  /api/v1/games/{gameId}/summary:
    get:
      tags:
      - game-controller
      operationId: getGameSummary
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameSummaryResponse"
  /api/v1/auth/me:
    get:
      tags:
      - authentication-controller
      operationId: getCurrentUser
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
components:
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          minLength: 2
      required:
      - displayName
    ProfileResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 12
      required:
      - currentPassword
      - newPassword
    UpdateDictionaryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        sourceLanguage:
          type: string
          minLength: 1
        targetLanguage:
          type: string
          minLength: 1
      required:
      - name
      - sourceLanguage
      - targetLanguage
    DictionaryDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        sourceLanguage:
          type: string
        targetLanguage:
          type: string
        cardCount:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpdateCardRequest:
      type: object
      properties:
        cardType:
          type: string
          enum:
          - WORD
          - NOUN
          - VERB
          - PHRASE
          - SENTENCE
        article:
          type: string
          maxLength: 20
          minLength: 0
        sourceText:
          type: string
          maxLength: 255
          minLength: 0
        primaryTranslation:
          type: string
          maxLength: 255
          minLength: 0
        acceptedAnswers:
          type: array
          items:
            type: string
        example:
          type: string
          maxLength: 1000
          minLength: 0
        notes:
          type: string
          maxLength: 1000
          minLength: 0
        difficultyLevel:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        tags:
          type: array
          items:
            type: string
      required:
      - cardType
      - sourceText
    CardDetailResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cardType:
          type: string
          enum:
          - WORD
          - NOUN
          - VERB
          - PHRASE
          - SENTENCE
        article:
          type: string
        sourceText:
          type: string
        primaryTranslation:
          type: string
        position:
          type: integer
          format: int32
        acceptedAnswers:
          type: array
          items:
            type: string
        example:
          type: string
        notes:
          type: string
        difficultyLevel:
          type: integer
          format: int32
        tags:
          type: array
          items:
            type: string
    CreateGameRequest:
      type: object
      properties:
        dictionaryId:
          type: integer
          format: int64
        gameMode:
          type: string
      required:
      - dictionaryId
    CurrentCardResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sourceText:
          type: string
        cardType:
          type: string
          enum:
          - WORD
          - NOUN
          - VERB
          - PHRASE
          - SENTENCE
        article:
          type: string
        example:
          type: string
    GameResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dictionaryId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - CREATED
          - STARTED
          - IN_PROGRESS
          - FINISHED
          - ABANDONED
        totalCards:
          type: integer
          format: int32
        answeredCards:
          type: integer
          format: int32
        correctAnswers:
          type: integer
          format: int32
        incorrectAnswers:
          type: integer
          format: int32
        currentCard:
          $ref: "#/components/schemas/CurrentCardResponse"
    GameSummaryResponse:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - CREATED
          - STARTED
          - IN_PROGRESS
          - FINISHED
          - ABANDONED
        totalCards:
          type: integer
          format: int32
        answeredCards:
          type: integer
          format: int32
        correctAnswers:
          type: integer
          format: int32
        incorrectAnswers:
          type: integer
          format: int32
        accuracy:
          type: number
          format: double
        durationSeconds:
          type: integer
          format: int64
        averageResponseTimeMs:
          type: number
          format: double
    SubmitAnswerRequest:
      type: object
      properties:
        cardId:
          type: integer
          format: int64
        answer:
          type: string
          maxLength: 500
          minLength: 1
        responseTimeMs:
          type: integer
          format: int64
      required:
      - answer
      - cardId
      - responseTimeMs
    AnswerValidationResponse:
      type: object
      properties:
        result:
          type: string
          enum:
          - CORRECT
          - WRONG_ARTICLE
          - WRONG_TRANSLATION
          - TYPO
          - MISSING_WORD
          - EXTRA_WORD
          - PARTIALLY_CORRECT
          - WRONG_SENTENCE
        correct:
          type: boolean
        givenAnswer:
          type: string
        expectedAnswer:
          type: string
        message:
          type: string
        nextCard:
          $ref: "#/components/schemas/CurrentCardResponse"
    CreateDictionaryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
          minLength: 0
        description:
          type: string
          maxLength: 1000
          minLength: 0
        sourceLanguage:
          type: string
          minLength: 1
        targetLanguage:
          type: string
          minLength: 1
      required:
      - name
      - sourceLanguage
      - targetLanguage
    CreateCardRequest:
      type: object
      properties:
        cardType:
          type: string
          enum:
          - WORD
          - NOUN
          - VERB
          - PHRASE
          - SENTENCE
        article:
          type: string
          maxLength: 20
          minLength: 0
        sourceText:
          type: string
          maxLength: 255
          minLength: 0
        primaryTranslation:
          type: string
          maxLength: 255
          minLength: 0
        acceptedAnswers:
          type: array
          items:
            type: string
        example:
          type: string
          maxLength: 1000
          minLength: 0
        notes:
          type: string
          maxLength: 1000
          minLength: 0
        difficultyLevel:
          type: integer
          format: int32
          maximum: 5
          minimum: 1
        tags:
          type: array
          items:
            type: string
      required:
      - cardType
      - sourceText
    DictionaryImportRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
        name:
          type: string
          maxLength: 150
          minLength: 1
        description:
          type: string
          maxLength: 1000
          minLength: 0
        sourceLanguage:
          type: string
          minLength: 1
        targetLanguage:
          type: string
          minLength: 1
      required:
      - file
      - name
      - sourceLanguage
      - targetLanguage
    DictionaryImportResponse:
      type: object
      properties:
        dictionaryId:
          type: integer
          format: int64
        name:
          type: string
        importedCards:
          type: integer
          format: int32
        status:
          type: string
        warnings:
          type: array
          items:
            type: string
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 12
        displayName:
          type: string
          maxLength: 100
          minLength: 2
      required:
      - displayName
      - email
      - password
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        displayName:
          type: string
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
      - refreshToken
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    DashboardStatisticsResponse:
      type: object
      properties:
        totalGames:
          type: integer
          format: int32
        totalAnswers:
          type: integer
          format: int32
        totalCorrectAnswers:
          type: integer
          format: int32
        totalIncorrectAnswers:
          type: integer
          format: int32
        overallAccuracy:
          type: number
          format: double
        totalStudyTimeSeconds:
          type: integer
          format: int64
        currentLearningStreak:
          type: integer
          format: int32
        longestLearningStreak:
          type: integer
          format: int32
        cardsDueToday:
          type: integer
          format: int64
